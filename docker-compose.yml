# Services the gateway needs. `docker compose up -d redis postgres` is enough
# to run the test suite; the gateway service itself is for the full demo.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    # 5433, not 5432: a host Postgres install claims loopback:5432 on many dev
    # machines, and `localhost` then silently resolves to it instead of here.
    # The failure looks like a missing role, not a port conflict, which costs
    # more time to diagnose than the odd port number costs to read.
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
