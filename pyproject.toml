[project]
name = "llm-gateway"
version = "0.1.0"
description = "Multi-provider LLM gateway with per-team rate limits, budget enforcement, and OTel tracing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "logfire[fastapi,httpx,asyncpg,redis]>=3.0.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    # Benchmark-only. `qdrant-client[fastembed]` matches grounded-rag so the
    # embedding numbers are comparable across the two projects.
    "qdrant-client[fastembed]>=1.12.0",
    # Wilson intervals live in horizon-bench and are already tested there.
    "horizon-bench",
]

[tool.uv.sources]
horizon-bench = { path = "../horizon-bench" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live Redis or Postgres (docker compose up -d redis postgres)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# asyncpg ships no py.typed marker. Scoped to that one import rather than a
# global relaxation, so everything else stays strictly checked.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
